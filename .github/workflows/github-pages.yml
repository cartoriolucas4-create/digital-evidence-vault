name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static application for GitHub Pages
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npx vite build --config vite.pages.config.ts 2>&1 | tee build-error.log
      - name: Report build error
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "GitHub Pages build failure ${{ github.sha }}" --body-file build-error.log || true
          exit 1

      - name: Stamp build version
        run: echo "BUILD_VERSION=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA}" > dist-pages/build-version.txt

      - name: Create dedicated administrative entry point
        run: |
          mkdir -p dist-pages/administrativo
          cp dist-pages/index.html dist-pages/administrativo/index.html

      - name: Verify Pages artifact
        run: |
          test -f dist-pages/index.html
          test -f dist-pages/administrativo/index.html
          find dist-pages -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
