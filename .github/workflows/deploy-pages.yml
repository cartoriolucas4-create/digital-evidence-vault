name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ".output/public" ]; then
            OUT=".output/public"
          elif [ -d "dist" ]; then
            OUT="dist"
          else
            echo "No static output directory found."
            find . -maxdepth 4 -type d \( -name public -o -name dist \) -print
            exit 1
          fi
          test -f "$OUT/index.html" || { echo "index.html missing from $OUT"; exit 1; }
          touch "$OUT/.nojekyll"
          cp "$OUT/index.html" "$OUT/404.html"
          echo "PAGES_OUTPUT=$OUT" >> "$GITHUB_ENV"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_OUTPUT }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
