name: Deploy MCR Web Push

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/mcr-push-reminders/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi
          supabase functions deploy mcr-push-reminders --project-ref krulxfcxalaxosebmiyh --no-verify-jwt
